# Tests dea-capture, and on main publishes its image to
# ghcr.io/<owner>/dea-capture (linux/amd64), tagged with the commit SHA and
# `main`. Deploy by digest, not tag.
name: processor

on:
  push:
    branches: [main]
    paths: ["processor/**", ".github/workflows/processor.yml"]
  pull_request:
    paths: ["processor/**", ".github/workflows/processor.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: processor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      # the service config must still match the pinned courier
      - run: uv run --extra service courier validate deploy/service.yaml

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dea-capture
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: processor
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - working-directory: .
        run: echo "ghcr.io/${{ github.repository_owner }}/dea-capture@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
