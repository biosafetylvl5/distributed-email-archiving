# The courier service that runs dea-capture: one pod, in-memory broker.
#
#   watch-issues    polls the archive for new .eml objects
#   issue-builder   makes one job per message
#   issue           runs `dea-capture issue s3://<bucket>/<key>`: embeds, then
#                   resolves the links and queues them under captures/due/
#   watch-direct    emits captures/due/direct/ keys once their time has come
#   direct-builder  makes one job per due key
#   capture-direct  runs `dea-capture capture s3://<bucket>/<due key>`
#   watch-page, page-builder, capture-page
#                   the same for captures/due/page/: the page loads in
#                   browsertrix-crawler behind dea-capture's guarding proxy
#   watch-media, media-builder, capture-media
#                   the same for captures/due/media/: yt-dlp, behind the same
#                   proxy, writing to /tmp and streaming the file to R2
#   watch-gallery, gallery-builder, capture-gallery
#                   the same for captures/due/gallery/: one social media post
#                   with gallery-dl, behind the same proxy
#   summary-ticker, summary-builder, summary
#                   every 5 minutes, `dea-capture summary s3://<bucket>` rewrites
#                   dashboard/summary.json, the counts the admin dashboard shows
#
# Each builder takes only its own monitor's keys, by the monitor's hostname.
#
# Credentials and the R2 endpoint come from the environment (AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL), never from this file. On restart the
# poller sends every key again; `issue` skips messages that already have a
# manifest, so that costs one HEAD request each.
apiVersion: runcourier.dev/v1alpha1
kind: Service
metadata:
  name: dea-capture
  namespace: newsletter-archiving
  description: Captures what archived newsletters embed and link to.
spec:
  service_config:
    heartbeat_interval: 30
  broker:
    transport: memory
  run:
    - watch-issues:
        kind: data_monitor
        name: s3_poller
        config:
          bucket: newsletter-archive
          prefix: incoming/archive/
          suffix_filter: [".eml"]
          region: auto
          poll_interval_seconds: 300
          run_on_start: true
          hostname: issues
    - issue-builder:
        kind: job_builder
        name: filter_and_group
        config:
          files_per_job: 1
          filters: {hostname: issues}
          targets:
            - issue
          payload:
            issue-payload:
              kind: payload
              name: shell_payload
              config:
                # binary mode: every argument is its own argv entry, so an
                # object key is never parsed by a shell
                binary: dea-capture
                prefix_args:
                  - issue
                  - "{{ files[0].file }}"
    - issue:
        kind: dispatcher
        name: local_dispatcher
        config:
          max_workers: 2
          timeout_seconds: 1800
          log_to_logger: true
    - watch-direct:
        kind: data_monitor
        name: s3_due_poller
        config:
          bucket: newsletter-archive
          prefix: captures/due/direct/
          suffix_filter: [".json"]
          region: auto
          poll_interval_seconds: 60
          run_on_start: true
          hostname: due-direct
    - direct-builder:
        kind: job_builder
        name: filter_and_group
        config:
          files_per_job: 1
          filters: {hostname: due-direct}
          targets:
            - capture-direct
          payload:
            direct-payload:
              kind: payload
              name: shell_payload
              config:
                binary: dea-capture
                prefix_args:
                  - capture
                  - "{{ files[0].file }}"
    - capture-direct:
        kind: dispatcher
        name: local_dispatcher
        config:
          # one 100 MiB body in memory at a time
          max_workers: 1
          timeout_seconds: 900
          log_to_logger: true
    - watch-page:
        kind: data_monitor
        name: s3_due_poller
        config:
          bucket: newsletter-archive
          prefix: captures/due/page/
          suffix_filter: [".json"]
          region: auto
          poll_interval_seconds: 60
          run_on_start: true
          hostname: due-page
    - page-builder:
        kind: job_builder
        name: filter_and_group
        config:
          files_per_job: 1
          filters: {hostname: due-page}
          targets:
            - capture-page
          payload:
            page-payload:
              kind: payload
              name: shell_payload
              config:
                binary: dea-capture
                prefix_args:
                  - capture
                  - "{{ files[0].file }}"
    - capture-page:
        kind: dispatcher
        name: local_dispatcher
        config:
          # one browser at a time: the crawler's redis has a fixed port, and
          # a browser wants about 1-2 GiB
          max_workers: 1
          # a crawl is killed after 7 minutes, and a failed page may crawl its
          # Wayback snapshot too; this leaves time for both and the uploads
          timeout_seconds: 1800
          log_to_logger: true
    - watch-media:
        kind: data_monitor
        name: s3_due_poller
        config:
          bucket: newsletter-archive
          prefix: captures/due/media/
          suffix_filter: [".json"]
          region: auto
          poll_interval_seconds: 60
          run_on_start: true
          hostname: due-media
    - media-builder:
        kind: job_builder
        name: filter_and_group
        config:
          files_per_job: 1
          filters: {hostname: due-media}
          targets:
            - capture-media
          payload:
            media-payload:
              kind: payload
              name: shell_payload
              config:
                binary: dea-capture
                prefix_args:
                  - capture
                  - "{{ files[0].file }}"
    - capture-media:
        kind: dispatcher
        name: local_dispatcher
        config:
          # one post at a time: up to 1 GiB of parts, and the merged file, on /tmp
          max_workers: 1
          # yt-dlp is killed after 5 minutes probing and 90 downloading; this
          # leaves time to upload 1 GiB
          timeout_seconds: 7200
          log_to_logger: true
    - watch-gallery:
        kind: data_monitor
        name: s3_due_poller
        config:
          bucket: newsletter-archive
          prefix: captures/due/gallery/
          suffix_filter: [".json"]
          region: auto
          poll_interval_seconds: 60
          run_on_start: true
          hostname: due-gallery
    - gallery-builder:
        kind: job_builder
        name: filter_and_group
        config:
          files_per_job: 1
          filters: {hostname: due-gallery}
          targets:
            - capture-gallery
          payload:
            gallery-payload:
              kind: payload
              name: shell_payload
              config:
                binary: dea-capture
                prefix_args:
                  - capture
                  - "{{ files[0].file }}"
    - capture-gallery:
        kind: dispatcher
        name: local_dispatcher
        config:
          # one post at a time, so each site sees one reader
          max_workers: 1
          # gallery-dl is killed after 30 minutes; this leaves time to upload
          timeout_seconds: 3600
          log_to_logger: true
    - summary-ticker:
        kind: data_monitor
        name: ticker
        config:
          interval_seconds: 300
          hostname: summary-tick
    - summary-builder:
        kind: job_builder
        name: filter_and_group
        config:
          files_per_job: 1
          filters: {hostname: summary-tick}
          targets:
            - summary
          payload:
            summary-payload:
              kind: payload
              name: shell_payload
              config:
                binary: dea-capture
                prefix_args:
                  - summary
                  - s3://newsletter-archive
    - summary:
        kind: dispatcher
        name: local_dispatcher
        config:
          max_workers: 1
          timeout_seconds: 900
          log_to_logger: true
