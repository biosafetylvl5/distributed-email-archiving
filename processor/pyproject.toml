[project]
name = "dea-capture"
version = "0.1.0"
description = "Capture what an archived email links to and embeds, without acting as the subscriber"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "urllib3>=2.2",
]

[project.optional-dependencies]
# The courier runtime for the container image. Pinned to a commit of main until
# a release carries the plugin-restart fix (see the link archiving plan).
service = [
    "courier-pigeon[s3] @ https://github.com/CIRA-GEOIPS/courier/archive/3a12c6929a7733eac950dc6ed804e969c03fbbe8.tar.gz",
]

[project.scripts]
dea-capture = "dea_capture.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "boto3-stubs[s3]>=1.35",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dea_capture"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
